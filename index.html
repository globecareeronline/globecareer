<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GlobeCareer – Build Your Global Career. Stand Out Anywhere.</title>
    <meta
      name="description"
      content="Free international career platform. Create ATS-friendly resumes, cover letters, recommendation letters, outreach emails, and interview preparation for 40+ countries."
    />
    
    <!-- Favicon & Touch Icons (Multiples of 48px for Google Search + standard PNG/ICO/SVG) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0F172A" />

    <!-- Theme flash prevention -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('globecareer_theme') || localStorage.getItem('globecv_theme');
          if (theme === 'dark' || (!theme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Google Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap"
      rel="stylesheet"
    />

    <!-- Social & OpenGraph Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="GlobeCareer – Build Your Global Career. Stand Out Anywhere." />
    <meta
      property="og:description"
      content="Free international career platform. Create ATS-friendly resumes, cover letters, recommendation letters, outreach emails, and interview preparation for 40+ countries."
    />
    <meta property="og:site_name" content="GlobeCareer" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GlobeCareer – Build Your Global Career. Stand Out Anywhere." />
    <meta
      name="twitter:description"
      content="Free international career platform. Create ATS-friendly resumes, cover letters, recommendation letters, outreach emails, and interview preparation for 40+ countries."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Schema.org WebApplication & Organization Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebApplication",
          "name": "GlobeCareer",
          "applicationCategory": "BusinessApplication",
          "operatingSystem": "All",
          "description": "International CV and resume platform tailored for hiring rules and formats across 40 countries.",
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD"
          }
        },
        {
          "@type": "Organization",
          "name": "GlobeCareer",
          "url": "https://globecareer.online",
          "logo": "https://globecareer.online/globecareer-logo.png"
        }
      ]
    }
    </script>

    <!-- Local file:// protocol stylesheet fallback -->
    <script>
      if (window.location.protocol === 'file:') {
        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = './assets/index.css';
        document.head.appendChild(link);
      }
    </script>
  </head>
  <body class="bg-neutral-50 text-neutral-900 antialiased selection:bg-neutral-900 selection:text-white dark:bg-neutral-950 dark:text-neutral-100">
    <div id="root"></div>
    <script>
      // Standalone script loader for direct local execution without server (file:// protocol)
      if (window.location.protocol === 'file:') {
        var script = document.createElement('script');
        script.defer = true;
        script.src = './assets/app.js';
        document.body.appendChild(script);

        // Friendly launcher helper if browser security blocks local scripts from file:// origin
        window.addEventListener('DOMContentLoaded', function() {
          setTimeout(function() {
            var rootEl = document.getElementById('root');
            if (rootEl && !rootEl.hasChildNodes()) {
              rootEl.innerHTML = '\
                <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f172a;color:#f8fafc;font-family:system-ui,-apple-system,sans-serif;padding:24px;">\
                  <div style="max-width:540px;background:#1e293b;border:1px solid #334155;border-radius:16px;padding:36px;box-shadow:0 25px 50px -12px rgba(0,0,0,0.5);text-align:center;">\
                    <div style="width:72px;height:72px;margin:0 auto 18px;background:rgba(59,130,246,0.1);border-radius:16px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(59,130,246,0.3);">\
                      <img src="./globecareer-logo.png" alt="GlobeCareer Logo" style="width:52px;height:52px;object-fit:contain;" />\
                    </div>\
                    <h1 style="font-size:22px;font-weight:700;margin-bottom:12px;color:#fff;">Start GlobeCareer via Local Launcher</h1>\
                    <p style="font-size:14px;line-height:1.6;color:#94a3b8;margin-bottom:24px;">\
                      Modern web browsers restrict JavaScript modules and full application storage when opened directly from disk (<code style="background:#0f172a;color:#38bdf8;padding:2px 6px;border-radius:4px;font-size:13px;">file://</code>) due to CORS security policies.\
                    </p>\
                    <div style="background:#0f172a;border:1px solid #334155;border-radius:10px;padding:20px;margin-bottom:24px;text-align:left;">\
                      <div style="font-size:14px;font-weight:600;color:#38bdf8;margin-bottom:10px;">Recommended 1-Click Launch:</div>\
                      <ol style="margin:0;padding-left:20px;font-size:13px;color:#cbd5e1;line-height:1.8;">\
                        <li><strong>Windows:</strong> Double-click <code style="color:#60a5fa;font-weight:bold;">start.bat</code> in the extracted folder.</li>\
                        <li><strong>macOS / Linux:</strong> Run <code style="color:#60a5fa;font-weight:bold;">./start.sh</code> in terminal.</li>\
                        <li><strong>Python:</strong> Run <code style="color:#60a5fa;font-weight:bold;">python start.py</code>.</li>\
                      </ol>\
                    </div>\
                    <p style="font-size:12px;color:#64748b;margin:0;">\
                      The launcher starts a local server and automatically opens GlobeCareer with all interactive resume builders, country guides, and tools.\
                    </p>\
                  </div>\
                </div>\
              ';
            }
          }, 1800);
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
