<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="referrer" content="no-referrer" />
    <title>Contact messages — owner access</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 32px 16px 64px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        background: #f5f5f5;
        color: #171717;
        line-height: 1.55;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0a0a0a; color: #e5e5e5; }
        .card { background: #141414 !important; border-color: #262626 !important; }
        input, textarea, button { background: #1a1a1a !important; color: #e5e5e5 !important; border-color: #333 !important; }
        .muted { color: #a3a3a3 !important; }
        .msg { border-color: #262626 !important; }
      }
      .wrap { max-width: 860px; margin: 0 auto; }
      h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -0.01em; }
      .muted { color: #737373; font-size: 12px; }
      .card { background: #fff; border: 1px solid #e5e5e5; border-radius: 14px; padding: 18px; margin-top: 18px; }
      label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; }
      input, textarea {
        width: 100%; padding: 9px 11px; font: inherit; font-size: 13px;
        background: #fafafa; border: 1px solid #d4d4d4; border-radius: 10px;
      }
      button {
        margin-top: 10px; padding: 9px 16px; font: inherit; font-size: 13px; font-weight: 600;
        color: #fff; background: #2563eb; border: 1px solid #2563eb; border-radius: 10px; cursor: pointer;
      }
      button[disabled] { opacity: 0.55; cursor: default; }
      #status { margin-top: 12px; font-size: 12px; min-height: 18px; }
      .error { color: #b91c1c; }
      .ok { color: #047857; }
      .msg { border: 1px solid #e5e5e5; border-radius: 12px; padding: 14px; margin-top: 12px; }
      .msg h2 { font-size: 13px; margin: 0 0 2px; }
      .meta { font-size: 11px; color: #737373; }
      .body { white-space: pre-wrap; font-size: 13px; margin-top: 10px; }
      .warn { font-size: 11px; color: #b45309; margin-top: 8px; }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Contact messages</h1>
      <p class="muted">
        Owner-only view of messages saved by the contact form. Access needs the admin token held in the
        Cloudflare Pages secret <code>ADMIN_TOKEN</code>. The token is kept in memory for this tab only and
        is never written to storage, a URL, or a log.
      </p>

      <form id="gate" class="card" autocomplete="off">
        <label for="token">Admin token</label>
        <input id="token" type="password" spellcheck="false" autocomplete="off" placeholder="Paste the ADMIN_TOKEN value" />
        <button id="unlock" type="submit">Load messages</button>
        <p id="status" role="status" aria-live="polite"></p>
      </form>

      <section id="results" class="hidden">
        <div class="card">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;">
            <div>
              <strong style="font-size: 13px;">Stored submissions</strong>
              <div id="summary" class="muted"></div>
            </div>
            <div>
              <button id="refresh" type="button" style="margin-top: 0;">Refresh</button>
              <button id="lock" type="button" style="margin-top: 0; background: transparent; color: inherit; border-color: #d4d4d4;">Lock</button>
            </div>
          </div>
          <p id="list-status" class="muted" style="margin: 10px 0 0;"></p>
        </div>
        <div id="list"></div>
        <div id="detail"></div>
      </section>
    </div>

    <script>
      (function () {
        'use strict';

        var token = '';
        var gate = document.getElementById('gate');
        var tokenInput = document.getElementById('token');
        var unlock = document.getElementById('unlock');
        var status = document.getElementById('status');
        var results = document.getElementById('results');
        var summary = document.getElementById('summary');
        var listStatus = document.getElementById('list-status');
        var listEl = document.getElementById('list');
        var detailEl = document.getElementById('detail');

        function setStatus(el, text, kind) {
          el.textContent = text || '';
          el.className = kind || '';
        }

        function el(tag, className, text) {
          var node = document.createElement(tag);
          if (className) node.className = className;
          if (text !== undefined) node.textContent = text;
          return node;
        }

        function when(iso) {
          if (!iso) return 'unknown time';
          var date = new Date(iso);
          if (isNaN(date.getTime())) return iso;
          return date.toISOString().replace('T', ' ').replace('.000Z', '') + ' UTC';
        }

        async function api(path) {
          var response = await fetch(path, {
            headers: { Authorization: 'Bearer ' + token, Accept: 'application/json' },
            cache: 'no-store',
            credentials: 'omit',
          });
          var payload = null;
          try { payload = await response.json(); } catch (e) { payload = null; }
          if (!response.ok) {
            var message = (payload && payload.error) || 'Request failed (' + response.status + ').';
            throw new Error(message);
          }
          return payload || {};
        }

        function renderMessage(message) {
          var card = el('article', 'msg');
          card.appendChild(el('h2', '', message.name || '(no name)'));
          card.appendChild(el('div', 'meta', (message.email || '') + ' · ' + when(message.receivedAt)));
          card.appendChild(el('div', 'body', message.message || ''));
          if (message.emailStatus && message.emailStatus !== 'sent') {
            card.appendChild(
              el('div', 'warn', 'Email notification: ' + message.emailStatus + ' — the message is safe in KV.')
            );
          }
          var actions = el('div', 'meta');
          actions.style.marginTop = '10px';
          var open = el('button', '');
          open.type = 'button';
          open.textContent = 'Show full details';
          open.style.marginTop = '0';
          open.style.fontSize = '11px';
          open.style.padding = '6px 10px';
          open.addEventListener('click', function () { loadDetail(message.id); });
          actions.appendChild(open);
          card.appendChild(actions);
          return card;
        }

        async function loadDetail(id) {
          if (!id) return;
          setStatus(listStatus, 'Loading details…');
          try {
            var payload = await api('/api/admin/messages?id=' + encodeURIComponent(id));
            var message = payload.message || {};
            detailEl.textContent = '';
            var card = el('div', 'card');
            card.appendChild(el('strong', '', 'Full record'));
            var rows = [
              ['Reference', message.id || ''],
              ['Received', when(message.receivedAt)],
              ['Name', message.name || ''],
              ['Email', message.email || ''],
              ['Email notification', message.emailStatus || ''],
              ['Attempted', when(message.emailAttemptedAt)],
              ['Origin IP', message.ip || 'not recorded'],
              ['User agent', message.userAgent || 'not recorded'],
            ];
            rows.forEach(function (row) {
              var line = el('div', 'meta');
              line.style.marginTop = '6px';
              line.textContent = row[0] + ': ' + row[1];
              card.appendChild(line);
            });
            card.appendChild(el('div', 'body', message.message || ''));
            detailEl.appendChild(card);
            setStatus(listStatus, 'Details loaded. Personal data stays in this tab only.');
          } catch (error) {
            setStatus(listStatus, error.message, 'error');
          }
        }

        async function loadList() {
          setStatus(listStatus, 'Loading messages…');
          listEl.textContent = '';
          detailEl.textContent = '';
          try {
            var payload = await api('/api/admin/messages?limit=50');
            var messages = payload.messages || [];
            summary.textContent = messages.length + ' shown' + (payload.truncated ? ' (more stored)' : '');
            if (messages.length === 0) {
              setStatus(listStatus, 'No stored messages yet.');
              return;
            }
            messages.forEach(function (message) { listEl.appendChild(renderMessage(message)); });
            setStatus(listStatus, 'Newest first. Messages are read directly from Cloudflare KV.');
          } catch (error) {
            setStatus(listStatus, error.message, 'error');
            if (/not found|invalid|unauthor|forbidden|expired/i.test(error.message)) lock();
          }
        }

        function lock() {
          token = '';
          tokenInput.value = '';
          results.classList.add('hidden');
          listEl.textContent = '';
          detailEl.textContent = '';
          summary.textContent = '';
        }

        gate.addEventListener('submit', async function (event) {
          event.preventDefault();
          var value = tokenInput.value.trim();
          if (value.length < 32) {
            setStatus(status, 'That token looks too short. Paste the full ADMIN_TOKEN value.', 'error');
            return;
          }
          token = value;
          tokenInput.value = '';
          unlock.disabled = true;
          setStatus(status, 'Checking access…');
          try {
            var probe = await api('/api/admin/messages?limit=1');
            setStatus(status, '', '');
            results.classList.remove('hidden');
            if ((probe.messages || []).length === 0) {
              summary.textContent = '0 shown';
              setStatus(listStatus, 'No stored messages yet.');
            } else {
              await loadList();
            }
          } catch (error) {
            token = '';
            setStatus(status, error.message, 'error');
          } finally {
            unlock.disabled = false;
          }
        });

        document.getElementById('refresh').addEventListener('click', loadList);
        document.getElementById('lock').addEventListener('click', function () {
          lock();
          setStatus(status, 'Locked. The token was discarded from this tab.', '');
        });
      })();
    </script>
  </body>
</html>
